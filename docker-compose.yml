services:
  chroma-server:
    image: chromadb/chroma:latest
    container_name: skripsi_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    restart: always

  api-skripsi:
    build: .
    container_name: skripsi_backend
    command: uvicorn src.main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./src:/app/src
      - hf_cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      # Konfigurasi koneksi Client-Server ke ChromaDB
      - CHROMA_HOST=chroma-server
      - CHROMA_PORT=8000
    depends_on:
      - chroma-server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always

  db-viewer:
    build: .
    container_name: skripsi_viewer
    command: streamlit run src/view_database.py --server.port 8501 --server.runOnSave true
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./src:/app/src
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - api-skripsi
      - chroma-server
    environment:
      - PYTHONUNBUFFERED=1
      # URL diubah murni ke endpoint /search (Information Retrieval / Semantic Search)
      - API_URL=http://api-skripsi:8000/search
      - CHROMA_HOST=chroma-server
      - CHROMA_PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

volumes:
  chroma_data:
  hf_cache: